version: '3.8'

services:
  broken_auth_lab:
    build: .
    container_name: broken_auth_lab
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - .:/app
    environment:
      - FLASK_APP=app.py
      - FLASK_DEBUG=0
      - FLASK_ENV=development
      - PYTHONUNBUFFERED=1
    restart: unless-stopped 
