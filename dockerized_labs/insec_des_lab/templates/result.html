<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Serialization result</title><link rel="icon" href="data:,"></head>
<body>
  <h1>Serialization result</h1>
  {% if serialized is defined %}
  <form action="{{ url_for('deserialize_data') }}" method="post">
    <label for="serialized_data">Serialized data</label>
    <textarea id="serialized_data" name="serialized_data" readonly>{{ serialized }}</textarea>
    <button type="submit">Deserialize user</button>
  </form>
  {% endif %}
  {% if message is defined %}<p id="message">{{ message }}</p>{% endif %}
  <a href="{{ url_for('index') }}">Start again</a>
</body>
</html>
