name: AppSecAI Security Analysis

on:
  workflow_dispatch:
    inputs:
      submit:
        description: Submit the verified single-case scan to production
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  id-token: write

env:
  OPENGREP_VERSION: "v1.16.1"

jobs:
  analyze:
    runs-on: ubuntu-latest
    env:
      PROCESSING_MODE: group_cc
      AUTO_CREATE_PRS: "true"
      GROUPING_ENABLED: "true"
      GROUPING_STRATEGY: smart
      GROUPING_STAGE: pre_remediation
      MAX_VULNERABILITIES_PER_PR: "10"
      AUTO_REMEDIATE: "true"
      API_URL: https://gh.cloud.appsecai.io
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Download OpenGrep
        run: |
          set -euo pipefail
          curl --max-time 120 -fLsS "https://github.com/opengrep/opengrep/releases/download/${OPENGREP_VERSION}/opengrep_manylinux_x86" -o opengrep
          echo 'dbda2cd3225278cbffb37231ece1900d7022481edfaeb04e0bedb54046945dd3  opengrep' | sha256sum -c -
          chmod +x opengrep

      - name: Run OpenGrep
        run: |
          set -euo pipefail
          ./opengrep scan --sarif --sarif-output=opengrep-results.sarif --config auto cutover_sql_fixture/app.py
          jq -e '[.runs[].results[]] | length > 0' opengrep-results.sarif >/dev/null
          jq -e '[.runs[].results[].locations[].physicalLocation.artifactLocation.uri] | all(. == "cutover_sql_fixture/app.py")' opengrep-results.sarif >/dev/null
          jq -e '[.runs[].results[].locations[].physicalLocation.region.startLine] | unique | length == 1' opengrep-results.sarif >/dev/null
          jq -c '{findings: ([.runs[].results[]] | length), rules: [.runs[].results[].ruleId] | unique}' opengrep-results.sarif

      - name: Verify ordinary lookup contract
        run: |
          set -euo pipefail
          python3 -m venv /tmp/cutover-sql-venv
          /tmp/cutover-sql-venv/bin/pip install -r cutover_sql_fixture/requirements.txt
          cd cutover_sql_fixture
          /tmp/cutover-sql-venv/bin/python -m unittest -v test_contract

      - name: Submit to AppSecAI with remediation enabled
        if: inputs.submit
        shell: bash
        run: |
          set -euo pipefail
          token_response="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            --get --data-urlencode "audience=${API_URL}" "${ACTIONS_ID_TOKEN_REQUEST_URL}")"
          token="$(jq -er '.value' <<<"${token_response}")"
          body="$(mktemp)"
          http="$(curl -sS -o "$body" -w '%{http_code}' -X POST "${API_URL}/api-product/submit" \
            -H "Authorization: Bearer ${token}" \
            -F 'file=@opengrep-results.sarif;type=application/sarif+json' \
            -F "processing_mode=${PROCESSING_MODE}" \
            -F "grouping_strategy=${GROUPING_STRATEGY}" \
            -F "grouping_stage=${GROUPING_STAGE}" \
            -F "max_vulnerabilities_per_pr=${MAX_VULNERABILITIES_PER_PR}" \
            -F "auto_remediate=${AUTO_REMEDIATE}" \
            -F "auto_create_prs=${AUTO_CREATE_PRS}" \
            -F 'comment_modification_mode=basic')"
          if [[ "${http}" != 2* ]]; then
            echo "submit_http=${http} response=$(jq -c '{detail, error_code}' "$body" 2>/dev/null)"
            exit 1
          fi
          echo "submit_http=${http} run_id=$(jq -er '.run_id' "$body") organization_id=$(jq -er '.organization_id' "$body")"
