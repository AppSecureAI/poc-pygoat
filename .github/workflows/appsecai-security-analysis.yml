name: AppSecAI Read-only Run Status
run-name: "Read-only status ${{ inputs.run_id }}"
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Existing run to observe; never submits or retries work
        type: string
        required: true
      organization_id:
        description: Organization owning the existing run
        type: string
        required: true
      include_results:
        description: Read customer-view results without code or narrative audit
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      API_URL: https://gh.cloud.appsecai.io
      RUN_ID: ${{ inputs.run_id }}
      ORGANIZATION_ID: ${{ inputs.organization_id }}
    steps:
      - name: Read existing run through customer status API
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9a-f]{24}$ ]]
          [[ "$ORGANIZATION_ID" =~ ^[0-9a-f]{24}$ ]]
          token_response="$(curl --max-time 30 -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            --get --data-urlencode "audience=${API_URL}" "${ACTIONS_ID_TOKEN_REQUEST_URL}")"
          token="$(jq -er '.value' <<<"$token_response")"
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          http="$(curl --max-time 60 -sS -o "$body" -w '%{http_code}' \
            -H "Authorization: Bearer ${token}" \
            "${API_URL}/api-product/organizations/${ORGANIZATION_ID}/runs/${RUN_ID}/status")"
          [[ "$http" == 200 ]] || { echo "status_http=$http"; exit 1; }
          python3 - "$body" <<'PYCODE'
          import json, os, re, sys
          from pathlib import Path
          data = json.loads(Path(sys.argv[1]).read_text())
          def status(value):
              if value is None: return None
              if not isinstance(value, str) or not re.fullmatch(r'[A-Za-z][A-Za-z_ -]{0,63}', value): raise ValueError('unexpected status scalar')
              return value
          summary = data.get('summary') or {}
          counts = {}
          for key in ('total_vulnerabilities', 'true_positives', 'false_positives', 'needs_manual_review_count', 'handled_error_count', 'remediation_success', 'remediation_failed', 'pr_count', 'skipped_count', 'validation_failure_count', 'not_attempted_count', 'remediation_unit_failure_count', 'push_failed_count'):
              value = summary.get(key)
              if value is not None:
                  if type(value) is not int or not 0 <= value <= 10000: raise ValueError('unexpected count')
                  counts[key] = value
          prs = summary.get('pr_urls') or []
          if not isinstance(prs, list) or len(prs) > 50: raise ValueError('PR bound')
          for url in prs:
              if not isinstance(url, str) or not re.fullmatch(r'https://github[.]com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/pull/[0-9]+', url): raise ValueError('unexpected PR URL')
          tracking = data.get('process_tracking') or {}
          stages = {key: status((tracking.get(key) or {}).get('status')) for key in ('find_status', 'triage_status', 'remediate_status', 'validate_status', 'push_status', 'grouping_status', 'remediation_validation_loop_status', 'overall_status')}
          results = data.get('results') or {}
          stage_counts = {}
          for key in ('find', 'triage', 'remediate', 'validate', 'push'):
              item = results.get(key)
              if item is not None:
                  count = item.get('count')
                  if type(count) is not int or not 0 <= count <= 10000: raise ValueError('unexpected stage count')
                  stage_counts[key] = count
          print('PUBLIC_RUN_STATUS_V1 '+json.dumps({'run_id': os.environ['RUN_ID'], 'organization_id': os.environ['ORGANIZATION_ID'], 'run_status': status(data.get('run_status')), 'summary_counts': counts, 'pr_urls': prs, 'stage_statuses': stages, 'stage_counts': stage_counts}, sort_keys=True))
          PYCODE
      - name: Read bounded customer-view result metadata
        if: inputs.include_results
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9a-f]{24}$ ]]
          [[ "$ORGANIZATION_ID" =~ ^[0-9a-f]{24}$ ]]
          token_response="$(curl --max-time 30 -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            --get --data-urlencode "audience=${API_URL}" "${ACTIONS_ID_TOKEN_REQUEST_URL}")"
          token="$(jq -er '.value' <<<"$token_response")"
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          http="$(curl --max-time 90 -sS -o "$body" -w '%{http_code}' \
            -H "Authorization: Bearer ${token}" \
            "${API_URL}/api-product/organizations/${ORGANIZATION_ID}/runs/${RUN_ID}/results?format=json&view=customer&include_fixed_code=false&include_narrative_audit=false")"
          [[ "$http" == 200 ]] || { echo "results_http=$http"; exit 1; }
          python3 - "$body" <<'PYRESULT'
          import json, os, re, sys
          from pathlib import Path
          raw = Path(sys.argv[1]).read_bytes()
          if len(raw) > 2000000: raise ValueError('customer export byte bound')
          data = json.loads(raw)
          run = data.get('run') or {}
          if run.get('id') != os.environ['RUN_ID']: raise ValueError('run identity')
          out = {}
          fields = ('vulnerability_id', 'filename', 'file', 'line', 'cwe', 'severity', 'triage_result', 'remediation_result', 'remediation_unit_id', 'fix_validated', 'compose_created', 'unit_pr_created', 'unit_pr_url', 'pr_url', 'pr_number', 'issue_reason')
          for key in ('finding_results', 'pull_requests', 'issues', 'planned_pull_requests', 'planned_issues', 'manual_review'):
              records = data.get(key)
              if records is None:
                  out[key] = {'present': False}
                  continue
              if not isinstance(records, list) or len(records) > 64: raise ValueError('customer row bound')
              rows = []
              for record in records:
                  if not isinstance(record, dict): raise ValueError('customer row type')
                  projected = {}
                  for name in fields:
                      if name not in record: continue
                      value = record[name]
                      if value is not None and type(value) not in (str, bool, int): raise ValueError('customer scalar type')
                      if isinstance(value, str) and (len(value) > 512 or any(ord(c) < 32 for c in value)): raise ValueError('customer scalar bound')
                      if name.endswith('_id') and value is not None and not re.fullmatch('[0-9a-f]{24}', value): raise ValueError('customer id')
                      if name.endswith('_url') and value is not None and not re.fullmatch(r'https://github[.]com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/(pull|issues)/[0-9]+', value): raise ValueError('customer artifact URL')
                      projected[name] = value
                  rows.append(projected)
              out[key] = {'present': True, 'rows': rows}
          print('PUBLIC_RUN_RESULTS_V1 '+json.dumps({'run_id': os.environ['RUN_ID'], 'organization_id': os.environ['ORGANIZATION_ID'], 'customer_view': True, 'fixed_code_requested': False, 'narrative_audit_requested': False, 'records': out}, sort_keys=True))
          PYRESULT
