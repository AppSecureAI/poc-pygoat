name: AppSecAI Security Analysis

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read
  id-token: write

env:
  OPENGREP_VERSION: "v1.16.1"

jobs:
  analyze:
    runs-on: ubuntu-latest
    env:
      # Pre-publish test of submit-run-action v1.2.1: individual remediation, auto-remediate unset.
      PROCESSING_MODE: individual_cc
      AUTO_CREATE_PRS: "true"
      GROUPING_ENABLED: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download OpenGrep
        run: |
          curl -sL "https://github.com/opengrep/opengrep/releases/download/${OPENGREP_VERSION}/opengrep_manylinux_x86" -o opengrep
          chmod +x opengrep

      - name: Run OpenGrep
        run: |
          ./opengrep scan --sarif --sarif-output=opengrep-results.sarif --config auto . || true

      - name: AppSecAI Security Analysis
        uses: AppSecureAI/submit-run-action@v1.2.1
        with:
          file: opengrep-results.sarif
