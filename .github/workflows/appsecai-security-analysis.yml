name: AppSecAI Run Status Acceptance

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Existing Product run ID
        required: true
        type: string
      organization_id:
        description: Organization owning the run
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  API_URL: https://gh.cloud.appsecai.io

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read existing run through customer API
        shell: bash
        env:
          RUN_ID: ${{ inputs.run_id }}
          ORGANIZATION_ID: ${{ inputs.organization_id }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9a-f]{24}$ ]]
          [[ "$ORGANIZATION_ID" =~ ^[0-9a-f]{24}$ ]]
          token_response="$(curl --max-time 20 -fsS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            --get --data-urlencode "audience=${API_URL}" "${ACTIONS_ID_TOKEN_REQUEST_URL}")"
          token="$(jq -er '.value' <<<"${token_response}")"
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          http="$(curl --max-time 30 -sS -o "$body" -w '%{http_code}' \
            --get --data-urlencode "organization_id=${ORGANIZATION_ID}" \
            -H "Authorization: Bearer ${token}" \
            "${API_URL}/api-product/submit/status/${RUN_ID}")"
          unset token token_response
          echo "status_http=${http} run_id=${RUN_ID}"
          [[ "$http" == 200 ]]
          jq -e '.run_status | type == "string"' "$body" >/dev/null
          jq -c '{run_status, stages: ((.process_tracking // {}) | to_entries |
            map(select(.value | type == "object" and has("status"))) |
            map({key: .key, value: (.value | {status, total_items, processed_items,
              success_count, error_count})}) | from_entries)}' "$body"
